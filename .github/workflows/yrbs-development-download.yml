name: Public YRBS development download
on:
  push:
    branches: ["research/yrbs-development-download"]
    paths: [".github/workflows/yrbs-development-download.yml"]
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve smaller CDC national ZIP and isolate development records
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime,timezone
          from concurrent.futures import ThreadPoolExecutor
          import urllib.request,json,hashlib,zipfile,re,collections,time
          OUT=Path('yrbs-development-download');OUT.mkdir()
          BASE='https://ftp.cdc.gov/pub/Data/YRBS/SADC_2019/'
          SOURCES=[('SADC_2019_National.zip',BASE+'SADC_2019_National.zip'),('SADC2019_combined_layout.sps',BASE+'2019-sadc-spss-input-program.sps')]
          receipt={'complete':False,'confirmation_2023_accessed':False,'empirical_models_run':False,'scope':'Official CDC combined NATIONAL archive ending in 2019; extract only 2017 and 2019. Not annual XXH release.','downloaded_at_utc':datetime.now(timezone.utc).isoformat()}
          def download(item):
              name,url=item;path=OUT/name;h=hashlib.sha256();n=0;t=time.time()
              with urllib.request.urlopen(url,timeout=180) as r,path.open('wb') as f:
                  while True:
                      chunk=r.read(262144)
                      if not chunk:break
                      n+=len(chunk)
                      if n>100000000:raise ValueError('Unexpected file size')
                      h.update(chunk);f.write(chunk)
                      if n%(5*1048576)<262144:print(name,n,'bytes',round(time.time()-t,1),'seconds',flush=True)
              return {'file':name,'url':url,'bytes':n,'sha256':h.hexdigest()}
          try:
              with ThreadPoolExecutor(max_workers=2) as p:receipt['downloads']=list(p.map(download,SOURCES))
              syntax=(OUT/'SADC2019_combined_layout.sps').read_text(encoding='utf-8-sig')
              m=re.search(r'\byear\s+(\d+)\s*-\s*(\d+)',syntax,re.I)
              if not m:raise ValueError('Year field absent from official SPSS layout')
              left,right=int(m[1])-1,int(m[2]);counts=collections.Counter();selected={2017:0,2019:0}
              sh={y:hashlib.sha256() for y in selected};source_h=hashlib.sha256();source_bytes=0
              with zipfile.ZipFile(OUT/'SADC_2019_National.zip') as z:
                  receipt['archive_members']=[{'name':x.filename,'bytes':x.file_size} for x in z.infolist()]
                  names=[n for n in z.namelist() if n.lower().endswith('.dat') and 'national' in n.lower()]
                  if len(names)!=1:raise ValueError('No unique national DAT member; inspect archive_members')
                  member=names[0];receipt['selected_source_member']=member
                  handles={y:(OUT/f'{y}_records_from_SADC2019.dat').open('wb') for y in selected}
                  try:
                      with z.open(member) as src:
                          for line in src:
                              source_h.update(line);source_bytes+=len(line)
                              if not line.strip():continue
                              year=int(line[left:right]);counts[year]+=1
                              if year>2019:raise ValueError('Data after 2019 are outside scope')
                              if year in handles:handles[year].write(line);sh[year].update(line);selected[year]+=1
                  finally:
                      for h in handles.values():h.close()
              receipt.update(source_uncompressed_sha256=source_h.hexdigest(),source_uncompressed_bytes=source_bytes,source_counts_by_year=dict(counts),selected_counts=selected,selected_sha256={y:h.hexdigest() for y,h in sh.items()},year_field_1_based=[left+1,right])
              if selected!={2017:14765,2019:13677}:raise ValueError('Development counts require investigation: '+str(selected))
              receipt['complete']=True
          except Exception as e:receipt['error']=type(e).__name__+': '+str(e)
          (OUT/'source_receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print(json.dumps(receipt,indent=2),flush=True)
          raise SystemExit(0 if receipt['complete'] else 1)
      - name: Retain official public archive and verified development records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs-official-development-files
          path: yrbs-development-download/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
