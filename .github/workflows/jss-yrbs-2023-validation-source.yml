name: JSS 2023 YRBS official validation source
on:
  push:
    branches: ["research/jss-2023-validation"]
    paths: [".github/workflows/jss-yrbs-2023-validation-source.yml"]
permissions: {}
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve official CDC 2023 national YRBS data and SPSS layout
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request, urllib.error, hashlib, json, zipfile, io, time
          OUT = Path("jss-yrbs-2023-official"); OUT.mkdir()
          INDEX="https://www.cdc.gov/yrbs/data/index.html"
          CANDIDATES=[
            ("XXH2023_YRBS_Data.zip","https://www.cdc.gov/yrbs/files/2023/XXH2023_YRBS_Data.zip"),
            ("XXH2023_YRBS_Data.dat","https://www.cdc.gov/yrbs/files/2023/XXH2023_YRBS_Data.dat"),
          ]
          SPSS="https://www.cdc.gov/yrbs/media/files/2026/03/2023XXH-SPSS.sps"
          receipt={"retrieved_utc":datetime.now(timezone.utc).isoformat(),"source_authority":"U.S. CDC",
                   "scope":"2023 national YRBS only","purpose":"locked later-cycle validation for JSS research article",
                   "attempts":[],"files":[],"complete":False}
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36"),
                             ("Accept","text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"),
                             ("Accept-Language","en-US,en;q=0.9")]
          try:
            try:
              with opener.open(INDEX,timeout=60) as r:
                page=r.read(400000)
              receipt["index_status"]="retrieved"
              receipt["index_sha256"]=hashlib.sha256(page).hexdigest()
            except Exception as e:
              receipt["index_status"]=f"{type(e).__name__}: {e}"
            payload=None; source_name=None; source_url=None
            for name,url in CANDIDATES:
              try:
                req=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36",
                  "Accept":"*/*","Referer":INDEX,"Sec-Fetch-Site":"same-origin","Sec-Fetch-Mode":"navigate"})
                with opener.open(req,timeout=120) as r:
                  data=r.read(30_000_001); final_url=r.geturl(); ctype=r.headers.get("Content-Type","")
                receipt["attempts"].append({"url":url,"status":"downloaded","bytes":len(data),"content_type":ctype,"final_url":final_url})
                if len(data)<1000 or len(data)>30_000_000: raise ValueError("unexpected payload size")
                if b"<html" in data[:1000].lower(): raise ValueError("HTML instead of data")
                payload=data; source_name=name; source_url=url; break
              except Exception as e:
                receipt["attempts"].append({"url":url,"status":"failed","error":f"{type(e).__name__}: {e}"})
                time.sleep(1)
            if payload is None: raise RuntimeError("All official national-data endpoints failed")
            if source_name.endswith(".zip"):
              z=zipfile.ZipFile(io.BytesIO(payload))
              names=z.namelist(); receipt["zip_members"]=names
              dats=[n for n in names if n.lower().endswith(".dat")]
              if len(dats)!=1: raise ValueError(f"expected one DAT member, got {dats}")
              raw=z.read(dats[0])
              (OUT/"XXH2023_YRBS_Data.zip").write_bytes(payload)
              receipt["files"].append({"file":"XXH2023_YRBS_Data.zip","url":source_url,"bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest()})
            else:
              raw=payload
            (OUT/"XXH2023_YRBS_Data.dat").write_bytes(raw)
            txt=raw.decode("utf-8-sig",errors="strict")
            lines=[ln for ln in txt.splitlines() if ln.strip()]
            if not (15000 <= len(lines) <= 25000): raise ValueError(f"unexpected row count {len(lines)}")
            if not all(len(ln)>=100 for ln in lines[:100]): raise ValueError("short fixed-width row")
            receipt["files"].append({"file":"XXH2023_YRBS_Data.dat","url":source_url,"bytes":len(raw),
                                     "sha256":hashlib.sha256(raw).hexdigest(),"nonblank_lines":len(lines)})
            req=urllib.request.Request(SPSS,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36",
                                                    "Accept":"*/*","Referer":INDEX})
            with opener.open(req,timeout=120) as r: sps=r.read(500000)
            st=sps.decode("utf-8-sig",errors="replace").upper()
            if "DATA LIST" not in st or "VALUE LABELS" not in st: raise ValueError("invalid SPSS syntax")
            (OUT/"2023XXH-SPSS.sps").write_bytes(sps)
            receipt["files"].append({"file":"2023XXH-SPSS.sps","url":SPSS,"bytes":len(sps),"sha256":hashlib.sha256(sps).hexdigest()})
            receipt["complete"]=True
          except Exception as e:
            receipt["error"]=f"{type(e).__name__}: {e}"
          (OUT/"source_receipt.json").write_text(json.dumps(receipt,indent=2),encoding="utf-8")
          print(json.dumps(receipt,indent=2),flush=True)
          raise SystemExit(0 if receipt["complete"] else 1)
      - name: Retain official source files and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jss-yrbs-2023-official
          path: jss-yrbs-2023-official/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
