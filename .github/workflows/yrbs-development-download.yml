name: Public YRBS development download
on:
  push:
    branches: ["research/yrbs-development-download"]
    paths: [".github/workflows/yrbs-development-download.yml"]
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public development source directories
        shell: python
        run: |
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          from pathlib import Path
          import urllib.request,json,hashlib,re
          OUT=Path('yrbs-development-download');OUT.mkdir()
          sources=[('cdc_2017_directory.html','https://ftp.cdc.gov/pub/Data/YRBS/sadc_2017/'),('cdc_2019_directory.html','https://ftp.cdc.gov/pub/Data/YRBS/SADC_2019/'),('cdc_root.html','https://ftp.cdc.gov/pub/Data/YRBS/'),('archive_2017_file_page.html','https://www.datalumos.org/datalumos/project/217921/version/V2/view?path=%2Fdatalumos%2F217921%2Ffcr%3Aversions%2FV2%2FXXH2017_YRBS_Data.dat&type=file')]
          def get(item):
              name,url=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:data=r.read(1000000)
                  (OUT/name).write_bytes(data)
                  text=data.decode('utf-8',errors='replace')
                  return {'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'links':re.findall(r'(?:href|src)=[\"\x27]([^\"\x27]+)',text),'status':'page_downloaded'}
              except Exception as e:return {'file':name,'url':url,'status':'failed','error':str(e)}
          with ThreadPoolExecutor(max_workers=4) as p:records=list(p.map(get,sources))
          receipt={'scope':'Source discovery only; no 2021/2023 data or modelling','complete_microdata_download':False,'files':records}
          (OUT/'source_discovery.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
      - name: Retain public discovery pages and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs-development-source-discovery
          path: yrbs-development-download/
          retention-days: 1
          if-no-files-found: error
