name: JSS 2023 YRBS official validation source
on:
  push:
    branches: ["research/jss-2023-validation"]
    paths: [".github/workflows/jss-yrbs-2023-validation-source.yml"]
permissions: {}
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve official CDC 2023 national YRBS data and SPSS layout
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request, hashlib, json, re
          OUT = Path("jss-yrbs-2023-official")
          OUT.mkdir()
          sources = [
              ("XXH2023_YRBS_Data.dat", "https://www.cdc.gov/yrbs/files/2023/XXH2023_YRBS_Data.dat"),
              ("2023XXH-SPSS.sps", "https://www.cdc.gov/yrbs/files/2023/2023XXH-SPSS.sps"),
          ]
          receipt = {
              "retrieved_utc": datetime.now(timezone.utc).isoformat(),
              "source_authority": "U.S. Centers for Disease Control and Prevention (CDC)",
              "scope": "2023 national YRBS only",
              "purpose": "locked later-cycle validation for Journal of Sports Sciences research article",
              "files": [],
              "complete": False,
          }
          try:
              for name, url in sources:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 public-data-reproducibility"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data = r.read(30_000_001)
                      final_url = r.geturl()
                      ctype = r.headers.get("Content-Type","")
                  if len(data) < 1000 or len(data) > 30_000_000:
                      raise ValueError(f"Unexpected payload size for {name}: {len(data)}")
                  if b"<html" in data[:1000].lower() or b"<!doctype html" in data[:1000].lower():
                      raise ValueError(f"HTML returned for {name}")
                  (OUT/name).write_bytes(data)
                  rec = {
                      "file": name,
                      "url": url,
                      "final_url": final_url,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "content_type": ctype
                  }
                  if name.endswith(".dat"):
                      txt = data.decode("utf-8-sig", errors="strict")
                      lines = [ln for ln in txt.splitlines() if ln.strip()]
                      if len(lines) < 15000:
                          raise ValueError(f"Too few nonblank records: {len(lines)}")
                      if not all(len(ln) >= 100 for ln in lines[:100]):
                          raise ValueError("Unexpectedly short fixed-width records")
                      rec["nonblank_lines"] = len(lines)
                      rec["min_line_length_first100"] = min(map(len, lines[:100]))
                  else:
                      txt = data.decode("utf-8-sig", errors="replace")
                      upper = txt.upper()
                      if "DATA LIST" not in upper or "VALUE LABELS" not in upper:
                          raise ValueError("SPSS input program lacks expected DATA LIST / VALUE LABELS sections")
                      rec["contains_data_list"] = True
                      rec["contains_value_labels"] = True
                  receipt["files"].append(rec)
              receipt["complete"] = True
          except Exception as e:
              receipt["error"] = f"{type(e).__name__}: {e}"
          (OUT/"source_receipt.json").write_text(json.dumps(receipt, indent=2), encoding="utf-8")
          print(json.dumps(receipt, indent=2), flush=True)
          raise SystemExit(0 if receipt["complete"] else 1)
      - name: Retain official source files and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jss-yrbs-2023-official
          path: jss-yrbs-2023-official/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
