name: Public YRBS development download
on:
  push:
    branches: ["research/yrbs-development-download"]
    paths: [".github/workflows/yrbs-development-download.yml"]
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and verify 2017 and 2019 only
        shell: python
        run: |
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, subprocess
          SOURCES = (
              ("2017_data.dat", "2017/XXH2017_YRBS_Data.dat", 14765),
              ("2017_layout.sps", "2017/2017XXH_SPSS.sps", None),
              ("2019_data.dat", "2019/XXH2019_YRBS_Data.dat", 13677),
              ("2019_layout.sps", "2019/2019XXH-SPSS.sps", None),
          )
          OUT = Path("yrbs-development-download")
          OUT.mkdir(exist_ok=False)
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"
          def fetch(item):
              name, suffix, expected = item
              rec = {"file": name, "expected_rows": expected, "attempts": []}
              urls = ["https://www.cdc.gov/yrbs/files/"+suffix,
                      "https://www.cdc.gov/healthyyouth/data/yrbs/files/"+suffix,
                      "https://www.cdc.gov/yrbs/files/"+suffix+"?download=1",
                      "https://cdc.gov/yrbs/files/"+suffix]
              for k,url in enumerate(urls):
                  tmp=OUT/(name+".tmp")
                  try:
                      r=subprocess.run(["curl","-4","--location","--fail-with-body","--connect-timeout","15","--max-time","45","--user-agent",UA,"--referer","https://www.cdc.gov/yrbs/data/national-yrbs-datasets-documentation.html","--header","Accept: */*","--output",str(tmp),"--write-out","%{http_code} %{url_effective}",url],capture_output=True,text=True,timeout=50)
                      if r.returncode:
                          preview=tmp.read_text(errors="replace")[:500] if tmp.exists() else ""
                          raise RuntimeError(str(r.returncode)+" "+r.stdout+" "+preview)
                      data=tmp.read_bytes()
                      if not 1000<=len(data)<=30_000_000:raise ValueError("Unexpected payload size")
                      if b"<html" in data[:1000].lower():raise ValueError("HTML instead of data")
                      text=data.decode("utf-8-sig")
                      lines=[x for x in text.splitlines() if x.strip()]
                      if expected is not None:
                          if len(lines)!=expected or min(map(len,lines))<100:raise ValueError("Record validation failed")
                      elif "DATA LIST" not in text.upper() or "VALUE LABELS" not in text.upper():raise ValueError("Not SPSS syntax")
                      tmp.rename(OUT/name)
                      rec.update(status="DOWNLOADED_BASIC_CHECKS_PASSED",source_url=url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),nonblank_lines=len(lines),retrieved_utc=datetime.now(timezone.utc).isoformat())
                      return rec
                  except Exception as e:
                      rec["attempts"].append({"url":url,"error":str(e)})
                      if tmp.exists():tmp.unlink()
              rec["status"]="FAILED"
              return rec
          with ThreadPoolExecutor(max_workers=4) as p: records=list(p.map(fetch,SOURCES))
          ok=all(r["status"]=="DOWNLOADED_BASIC_CHECKS_PASSED" for r in records)
          receipt={"complete":ok,"empirical_models_run":False,"confirmation_2023_accessed":False,"scope":"2017 and 2019 development only; basic checks not full metadata validation","files":records}
          (OUT/"source_receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          raise SystemExit(0 if ok else 1)
      - name: Retain public-source files and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs-2017-2019-development
          path: yrbs-development-download/
          retention-days: 1
          if-no-files-found: error
