name: Official YRBS 2021 validation source
on:
  push:
    branches: [research/yrbs-development-download]
    paths: [.github/workflows/yrbs-2021-validation-source.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check official 2021 source endpoints
        shell: python
        run: |
          import urllib.request,json,hashlib,re,time
          from pathlib import Path
          from datetime import datetime,timezone
          from concurrent.futures import ThreadPoolExecutor
          out=Path('yrbs-2021-official');out.mkdir()
          urls=[
            ('annual','https://www.cdc.gov/healthyyouth/data/yrbs/files/2021/XXH2021_YRBS_Data.dat','https://www.cdc.gov/healthyyouth/data/yrbs/files/2021/2021XXH-SPSS.sps'),
            ('annual','https://cdc.gov/yrbs/files/2021/XXH2021_YRBS_Data.dat','https://cdc.gov/yrbs/files/2021/2021XXH-SPSS.sps'),
            ('combined','https://www.cdc.gov/yrbs/files/sadc_2021/SADC_2021_National.dat','https://www.cdc.gov/yrbs/files/sadc_2021/2021-SADC-SPSS-Input-Program.sps')]
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          attempts=[];complete=False
          for kind,url,layouturl in urls:
            rec={'kind':kind,'url':url,'layout_url':layouturl}
            try:
              with urllib.request.urlopen(urllib.request.Request(layouturl,headers=headers),timeout=45) as r:layout=r.read(500000)
              if b'DATA LIST' not in layout.upper():raise ValueError('Not an SPSS layout')
              req=urllib.request.Request(url,headers=dict(headers,Range='bytes=0-1023'))
              with urllib.request.urlopen(req,timeout=60) as r:
                status=r.status;cr=r.headers.get('Content-Range','');first=r.read(64*1024*1024+1)
              if status==200:
                if len(first)>64*1024*1024:raise ValueError('Unbounded response; stopped')
                data=first
              elif status==206:
                total=int(cr.split('/')[-1]);start=0 if kind=='annual' else max(0,total-32*1048576)
                tasks=[(a,min(a+1048576,total)-1) for a in range(start,total,1048576)]
                if len(tasks)>64:raise ValueError('Source over transfer bound')
                def part(t):
                  a,b=t;req=urllib.request.Request(url,headers=dict(headers,Range=f'bytes={a}-{b}'))
                  with urllib.request.urlopen(req,timeout=100) as r:
                    if r.status!=206 or r.headers.get('Content-Range')!=f'bytes {a}-{b}/{total}':raise ValueError('Range mismatch')
                    d=r.read(b-a+2)
                  if len(d)!=b-a+1:raise ValueError('Length mismatch')
                  return d
                with ThreadPoolExecutor(max_workers=4) as p:data=b''.join(p.map(part,tasks))
                if start:data=data.split(b'\n',1)[1]
                rec.update(source_total_bytes=total,range_start=start)
              else:raise ValueError('Unexpected HTTP status')
              if kind=='combined':
                m=re.search(r'\byear\s+(\d+)\s*-\s*(\d+)',layout.decode('utf-8-sig'),re.I)
                if not m:raise ValueError('Year absent')
                a,b=int(m[1])-1,int(m[2]);data=b''.join(x for x in data.splitlines(keepends=True) if x.strip() and int(x[a:b])==2021)
              if len([x for x in data.splitlines() if x.strip()])!=17232:raise ValueError('Wrong national count')
              (out/'national2021.dat').write_bytes(data);(out/'layout2021.sps').write_bytes(layout)
              rec.update(complete=True,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),layout_sha256=hashlib.sha256(layout).hexdigest(),retrieved_utc=datetime.now(timezone.utc).isoformat())
              complete=True;attempts.append(rec);break
            except Exception as e:rec.update(complete=False,error=type(e).__name__+': '+str(e));attempts.append(rec)
          report={'complete':complete,'confirmation_2023_accessed':False,'models_run':False,'attempts':attempts}
          (out/'source_receipt.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          raise SystemExit(0 if complete else 1)
      - name: Retain sources and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs-2021-official-validation-source
          path: yrbs-2021-official/
          retention-days: 7
          if-no-files-found: error
