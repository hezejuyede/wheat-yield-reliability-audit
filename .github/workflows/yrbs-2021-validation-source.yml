name: Official YRBS 2021 validation source
on:
  push:
    branches: [research/yrbs-development-download]
    paths: [.github/workflows/yrbs-2021-validation-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve and validate official 2021 files; no 2023 access
        shell: python
        run: |
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          import urllib.request, hashlib, json, time
          out=Path('yrbs-2021-official');out.mkdir()
          items=[
            ('national2021.dat','https://www.cdc.gov/yrbs/files/2021/XXH2021_YRBS_Data.dat','data'),
            ('layout2021.sps','https://www.cdc.gov/yrbs/files/2021/2021XXH-SPSS.sps','layout'),
            ('guide2021.pdf','https://www.cdc.gov/yrbs/files/2021/pdf/2021_YRBS_Data_Users_Guide_508.pdf','guide')]
          def get(item):
            name,url,kind=item; rec={'name':name,'url':url,'kind':kind,'complete':False}
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'YRBS research source audit'})
                with urllib.request.urlopen(req,timeout=150) as r:
                  data=r.read(64*1024*1024+1)
                  rec.update(status=r.status,final_url=r.url,content_type=r.headers.get('Content-Type'),etag=r.headers.get('ETag'),last_modified=r.headers.get('Last-Modified'))
                if not 1000<len(data)<=64*1024*1024:raise ValueError('Invalid source size')
                if b'<html' in data[:1024].lower() or b'<!doctype html' in data[:1024].lower():raise ValueError('HTML instead of source')
                if kind=='guide' and not data.startswith(b'%PDF'):raise ValueError('Not PDF')
                if kind=='layout' and b'DATA LIST' not in data.upper():raise ValueError('SPSS DATA LIST absent')
                if kind=='data':
                  lines=[x for x in data.splitlines() if x.strip()]
                  rec.update(nonblank_records=len(lines),record_widths=sorted(set(map(len,lines))))
                  if len(lines)!=17232:raise ValueError('Unexpected 2021 national record count')
                (out/name).write_bytes(data)
                rec.update(complete=True,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),retrieved_utc=datetime.now(timezone.utc).isoformat())
                return rec
              except Exception as e:
                rec['error']=type(e).__name__+': '+str(e);rec['attempts']=attempt+1
                if attempt<2:time.sleep(3)
            return rec
          with ThreadPoolExecutor(max_workers=3) as pool:records=list(pool.map(get,items))
          report={'purpose':'Existing 2021 temporal-validation cycle, not 2023 confirmation','confirmation_2023_accessed':False,'models_run':False,'complete':all(x['complete'] for x in records),'sources':records}
          (out/'source_receipt.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          raise SystemExit(0 if report['complete'] else 1)
      - name: Retain official files and source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs-2021-official-validation-source
          path: yrbs-2021-official/
          retention-days: 7
          if-no-files-found: error
