name: YRBS 2021 preserved source comparison
on:
  push:
    branches: [research/yrbs-development-download]
    paths: [.github/workflows/yrbs-2021-preservation-retrieval.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download preserved sources with explicit noncustodian provenance
        shell: python
        run: |
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          import urllib.request,hashlib,json
          out=Path('yrbs2021-preservation');out.mkdir()
          items=[
            ('preserved2021.dat','https://www.restoredcdc.org/www.cdc.gov/healthyyouth/data/yrbs/files/2021/XXH2021_YRBS_Data.dat'),
            ('preserved2021.sps','https://www.restoredcdc.org/www.cdc.gov/healthyyouth/data/yrbs/files/2021/2021XXH-SPSS.sps'),
            ('guide2021.pdf','https://www.restoredcdc.org/www.cdc.gov/yrbs/files/2021/pdf/2021_YRBS_Data_Users_Guide_508.pdf'),
            ('independent_original_2021.txt','https://raw.githubusercontent.com/ekrichards/YRBS_2021_Analysis/c54170ba2aaa47f46890c1d61431603ef7283d9a/YRBS_National_2021_Original.txt'),
            ('independent_binary_2021.txt','https://raw.githubusercontent.com/ekrichards/YRBS_2021_Analysis/c54170ba2aaa47f46890c1d61431603ef7283d9a/YRBS_National_2021_Binary.txt'),
            ('independent_2005_2021.parquet','https://raw.githubusercontent.com/dahdor/wired-apart/dd732ac63f230e05e0d44e24ed3503d2b92d5cc1/data/processed/yrbs_2005_2021.parquet'),
            ('independent_provenance.md','https://raw.githubusercontent.com/dahdor/wired-apart/dd732ac63f230e05e0d44e24ed3503d2b92d5cc1/references/data_provenance.md')]
          def get(item):
            name,url=item;r={'name':name,'url':url,'complete':False}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=100) as s:
                d=s.read(32*1024*1024+1);r.update(http=s.status,final_url=s.url)
              if len(d)>32*1024*1024 or len(d)<100:raise ValueError('size limit')
              if b'<html' in d[:1024].lower() or b'<!doctype html' in d[:1024].lower():raise ValueError('HTML instead of expected source')
              (out/name).write_bytes(d)
              r.update(complete=True,bytes=len(d),sha256=hashlib.sha256(d).hexdigest(),git_blob_sha1=hashlib.sha1(b'blob '+str(len(d)).encode()+b'\x00'+d).hexdigest())
            except Exception as e:r['error']=type(e).__name__+': '+str(e)
            return r
          with ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(get,items))
          report={'retrieved_utc':datetime.now(timezone.utc).isoformat(),'sources_are_preserved_or_converted_not_direct_CDC_download':True,'custodian_checksum_available':False,'requires_validation_before_modeling':True,'confirmation_2023_accessed':False,'sources':rows}
          (out/'retrieval_receipt.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
      - name: Retain source bytes and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yrbs2021-preservation-source-check
          path: yrbs2021-preservation/
          retention-days: 7
          if-no-files-found: error
