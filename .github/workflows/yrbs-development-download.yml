name: Public YRBS development download
on:
  push:
    branches: ["research/yrbs-development-download"]
    paths: [".github/workflows/yrbs-development-download.yml"]
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and verify development files only
        shell: python
        run: |
          """Download public 2017/2019 CDC development files only; no modelling."""
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, time, urllib.request
          
          SOURCES = (
              ("2017_data.dat", "https://www.cdc.gov/yrbs/files/2017/XXH2017_YRBS_Data.dat", 14765),
              ("2017_layout.sps", "https://www.cdc.gov/yrbs/files/2017/2017XXH_SPSS.sps", None),
              ("2019_data.dat", "https://www.cdc.gov/yrbs/files/2019/XXH2019_YRBS_Data.dat", 13677),
              ("2019_layout.sps", "https://www.cdc.gov/yrbs/files/2019/2019XXH-SPSS.sps", None),
          )
          OUT = Path("yrbs-development-download")
          
          def fetch(item):
              name, url, expected = item
              rec = {"file": name, "source_url": url, "expected_rows": expected, "attempts": []}
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 public-data-reproducibility"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          data = response.read(30_000_001)
                          final_url = response.geturl()
                          content_type = response.headers.get("Content-Type", "")
                      if len(data) > 30_000_000 or len(data) < 1000:
                          raise ValueError("Unexpected payload size")
                      if b"<html" in data[:1000].lower() or b"<!doctype html" in data[:1000].lower():
                          raise ValueError("HTML returned in place of the requested data file")
                      text = data.decode("utf-8-sig")
                      lines = [line for line in text.splitlines() if line.strip()]
                      if expected is not None:
                          if len(lines) != expected:
                              raise ValueError(f"Row count mismatch: observed {len(lines)}, expected {expected}")
                          if not all(len(line) >= 100 for line in lines):
                              raise ValueError("Unexpected short fixed-width record")
                      elif "DATA LIST" not in text.upper() or "VALUE LABELS" not in text.upper():
                          raise ValueError("File does not contain the expected SPSS layout sections")
                      (OUT / name).write_bytes(data)
                      rec.update(status="DOWNLOADED_BASIC_CHECKS_PASSED", bytes=len(data),
                                 sha256=hashlib.sha256(data).hexdigest(), nonblank_lines=len(lines),
                                 final_url=final_url, content_type=content_type,
                                 retrieved_utc=datetime.now(timezone.utc).isoformat())
                      return rec
                  except Exception as exc:
                      rec["attempts"].append({"number": attempt, "error": f"{type(exc).__name__}: {exc}"})
                      if attempt < 3:
                          time.sleep(attempt * 2)
              rec["status"] = "FAILED"
              return rec
          
          if __name__ == "__main__":
              OUT.mkdir(exist_ok=False)
              with ThreadPoolExecutor(max_workers=4) as pool:
                  records = list(pool.map(fetch, SOURCES))
              ok = all(r["status"] == "DOWNLOADED_BASIC_CHECKS_PASSED" for r in records)
              receipt = {"complete": ok, "empirical_models_run": False, "confirmation_2023_accessed": False,
                         "scope": "2017 and 2019 development only; basic checks are not full metadata validation", "files": records}
              (OUT / "source_receipt.json").write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding="utf-8")
              for r in records:
                  print(r["file"], r["status"], r.get("bytes", 0), r.get("sha256", ""))
              raise SystemExit(0 if ok else 1)
      - name: Retain public-source files and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yrbs-2017-2019-development
          path: yrbs-development-download/
          retention-days: 1
          if-no-files-found: error
